plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.0.0'
    id 'application'
}

group = 'com.codekarta'
version = '0.9'

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    implementation group: 'io.javalin', name: 'javalin', version: '4.6.8'
    implementation group: 'org.slf4j', name: 'slf4j-simple', version: '1.8.0-beta4'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.9.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.12.4'
}


task installFrontend(type: Exec) {
    workingDir 'config-ui'
    commandLine 'pnpm', 'install'
}

task buildFrontend(type: Exec, dependsOn: installFrontend) {
    workingDir 'config-ui'
    commandLine 'pnpm', 'run', 'build'
}

task cleanFrontend(type: Delete) {
    delete 'src/main/resources/build'
}


task copyFrontendToResources(type: Copy, dependsOn: buildFrontend) {
    from 'config-ui/dist'
    into 'src/main/resources/dist' // optional: you can change target path if needed
}
//
// copyFrontendToResources.dependsOn cleanFrontend
// build.dependsOn(copyFrontendToResources)


test {
    useJUnitPlatform()
}

compileKotlin {
    kotlinOptions.jvmTarget = '1.8'
}

compileTestKotlin {
    kotlinOptions.jvmTarget = '1.8'
}

application {
    mainClassName = 'MainKt'
}

jar {
    manifest {
        attributes "Main-Class": "MainKt"
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}